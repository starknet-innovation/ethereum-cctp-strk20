name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-backend.yml
      - .dockerignore
      - Dockerfile.api
      - apps/api/**
      - infra/aws/**
      - package-lock.json
      - package.json
      - packages/shared/**
      - tsconfig.base.json
      - vendor/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ethereum-cctp-strk20-backend-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "905846953990"
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: ethereum-cctp-strk20-api
  STACK_NAME: ethereum-cctp-strk20-backend
  CLOUDFORMATION_ROLE_ARN: arn:aws:iam::905846953990:role/ethereum-cctp-strk20-cfn-exec

jobs:
  deploy:
    name: Test, publish, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.8.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace
        run: npm run check

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::905846953990:role/ethereum-cctp-strk20-github-deploy
          role-session-name: github-${{ github.run_id }}-${{ github.run_attempt }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Check for an existing immutable image
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          if output=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "ImageNotFoundException" <<< "$output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$output" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish API image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy guarded CloudFormation change set
        env:
          IMAGE_TAG: ${{ github.sha }}
          CHANGE_SET_NAME: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash infra/aws/deploy-backend.sh
